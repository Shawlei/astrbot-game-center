<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>双色球</title>
<link rel="stylesheet" href="/css/style.css">
<style>
:root {
  --red-ball: #e0565c;
  --blue-ball: #4a7df0;
}
.card + .card { margin-top: 14px; }

.jackpot-banner {
  display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  background: linear-gradient(135deg, rgba(224,86,92,.16), rgba(74,125,240,.14));
  border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px;
}
.jackpot-banner .jp { flex: 1; min-width: 160px; }
.jackpot-banner .jp .label { font-size: 12px; color: var(--muted); }
.jackpot-banner .jp .val { font-size: 24px; font-weight: 800; color: var(--gold); margin-top: 2px; }
.jackpot-banner .meta-col { font-size: 13px; color: var(--muted); line-height: 1.9; }
.jackpot-banner .meta-col b { color: var(--text); }

.sec-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 18px 0 10px; }
.sec-title .hint { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; }

.ball-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 8px; }
.ball {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; font-size: 14px; font-weight: 700; cursor: pointer;
  background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  transition: all .12s ease; user-select: none;
}
.ball:hover { border-color: var(--accent); transform: translateY(-1px); }
.ball.red.on { background: radial-gradient(circle at 32% 30%, #ff8a8f, var(--red-ball)); border-color: transparent; color: #fff; box-shadow: 0 2px 6px rgba(224,86,92,.5); }
.ball.blue.on { background: radial-gradient(circle at 32% 30%, #7ea4ff, var(--blue-ball)); border-color: transparent; color: #fff; box-shadow: 0 2px 6px rgba(74,125,240,.5); }

.picker-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.picker-actions button { font-size: 13px; }

.mult-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.mult-row .mult-quick { display: flex; gap: 6px; }
.mult-row .mult-quick button { padding: 6px 12px; font-size: 13px; }
.mult-row .mult-quick button.on { background: var(--accent); color: #fff; border-color: transparent; }

.cost-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-top: 16px;
}
.cost-bar .cost-label { font-size: 13px; color: var(--muted); line-height: 1.6; }
.cost-bar .cost-label b { color: var(--text); }
.cost-bar .cost-amount { font-size: 22px; font-weight: 800; color: var(--green); }
.cost-bar .cost-amount.err { color: var(--red); }

.buy-btn { width: 100%; margin-top: 14px; padding: 14px; font-size: 16px; }

.prize-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.prize-table th, .prize-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.prize-table th { color: var(--muted); font-weight: 500; }
.prize-table .tier-badge { display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 6px; font-weight: 700; }
.prize-table .t1 { background: rgba(240,180,41,.2); color: var(--gold); }
.prize-table .t2 { background: rgba(224,86,92,.18); color: #ff9aa0; }
.prize-table .t3 { background: rgba(74,125,240,.18); color: #9db8ff; }

.latest-nums { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.latest-nums .win-ball { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 14px; }
.latest-nums .win-ball.r { background: var(--red-ball); }
.latest-nums .win-ball.b { background: var(--blue-ball); }

.ticket { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; background: var(--panel); }
.ticket .t-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.ticket .t-nums { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.ticket .t-nums .n { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
.ticket .t-nums .n.r { background: var(--red-ball); }
.ticket .t-nums .n.b { background: var(--blue-ball); }
.ticket .t-nums .plus { color: var(--muted); }
.ticket .t-meta { font-size: 12px; color: var(--muted); margin-top: 6px; }
.ticket .t-win { font-size: 13px; font-weight: 700; margin-top: 6px; }
.ticket .t-win.win { color: var(--green); }
.ticket .t-win.lose { color: var(--muted); }

.hist-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.hist-row:last-child { border-bottom: none; }
.hist-row .issue { color: var(--muted); min-width: 88px; }
.countdown { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); }

.muted-empty { text-align: center; color: var(--muted); padding: 16px 0; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left" style="display:flex;align-items:center;gap:12px">
      <a class="back-btn" href="/" id="backBtn">← 大厅</a>
      <div class="title">🎟️ 双色球</div>
    </div>
    <span class="badge" id="issueBadge">加载中…</span>
  </div>
  <div id="authBar"></div>

  <!-- 奖池 / 开奖信息 -->
  <div class="jackpot-banner" id="jackpotBanner">
    <div class="jp">
      <div class="label">一等奖奖池（滚存）</div>
      <div class="val" id="jackpotVal">$0.00</div>
    </div>
    <div class="meta-col">
      <div>当前期号：<b id="curIssue">—</b></div>
      <div>每注 <b id="ticketPrice">$1</b> · 每日 <b id="drawTime">20:00</b> 开奖</div>
      <div>距开奖：<span class="countdown" id="countdown">—</span></div>
    </div>
  </div>

  <!-- 最近开奖 -->
  <div class="card" id="latestCard" style="display:none">
    <div class="sec-title" style="margin-top:0">上期开奖 <span class="hint" id="latestIssue"></span></div>
    <div class="latest-nums" id="latestNums"></div>
  </div>

  <!-- 选号 -->
  <div class="card">
    <div class="sec-title" style="margin-top:0">红球 <span class="hint">选 6 个（复式可选 7~16 个）</span></div>
    <div class="ball-grid" id="redGrid"></div>
    <div class="sec-title">蓝球 <span class="hint">选 1 个（复式可选 2~16 个）</span></div>
    <div class="ball-grid" id="blueGrid"></div>

    <div class="picker-actions">
      <button id="btnAuto1">🎲 机选一注</button>
      <button id="btnAuto5">🎲 机选五注</button>
      <button id="btnClear" class="danger">清空</button>
    </div>

    <div class="mult-row">
      <span style="font-size:13px;color:var(--muted)">倍数：</span>
      <div class="mult-quick" id="multQuick"></div>
      <input id="mult" type="number" min="1" max="99" value="1" style="width:80px">
      <span style="font-size:12px;color:var(--muted)">（1~99 倍，单票多倍投注）</span>
    </div>

    <div class="cost-bar">
      <div class="cost-label" id="costLabel">请选择号码</div>
      <div class="cost-amount" id="costAmount">$0</div>
    </div>
    <button id="btnBuy" class="primary buy-btn" disabled>立即购票</button>
    <div class="status" id="status">选择 6 个红球 + 1 个蓝球即可购票</div>
  </div>

  <!-- 奖级表 -->
  <div class="card">
    <div class="sec-title" style="margin-top:0">奖级设置 <span class="hint">每注固定奖金 = 倍数 × 每注价格</span></div>
    <table class="prize-table">
      <thead><tr><th>奖级</th><th>中奖条件</th><th>单注奖金</th></tr></thead>
      <tbody id="prizeBody"></tbody>
    </table>
  </div>

  <!-- 我的彩票 -->
  <div class="card">
    <div class="sec-title" style="margin-top:0">我的彩票 <span class="hint" id="myHint"></span></div>
    <div id="myTickets"><div class="muted-empty">登录后查看当前期及上期彩票</div></div>
  </div>

  <!-- 开奖历史 -->
  <div class="card">
    <div class="sec-title" style="margin-top:0">开奖历史</div>
    <div id="history"><div class="muted-empty">加载中…</div></div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
const gid = new URLSearchParams(location.search).get('gid');
document.getElementById('backBtn').href = '/' + (gid ? '?gid=' + encodeURIComponent(gid) : '');

let ticketPrice = 1, maxMult = 99, quotaPerUnit = 500000;
let drawAt = 0, jackpot = 0;
let redSel = new Set(), blueSel = new Set();
let busy = false;

const redGrid = document.getElementById('redGrid');
const blueGrid = document.getElementById('blueGrid');

function comb(n, k) {
  if (k < 0 || k > n) return 0;
  let r = 1;
  for (let i = 1; i <= k; i++) r = r * (n - k + i) / i;
  return Math.round(r);
}
function zhuCount() {
  const r = redSel.size, b = blueSel.size;
  if (r < 6 || b < 1) return 0;
  return comb(r, 6) * b;
}

// 构建选号球
function buildBalls() {
  redGrid.innerHTML = '';
  blueGrid.innerHTML = '';
  for (let i = 1; i <= 33; i++) {
    const b = document.createElement('div');
    b.className = 'ball red';
    b.textContent = i;
    b.dataset.n = i;
    b.onclick = () => toggleRed(i);
    redGrid.appendChild(b);
  }
  for (let i = 1; i <= 16; i++) {
    const b = document.createElement('div');
    b.className = 'ball blue';
    b.textContent = i;
    b.dataset.n = i;
    b.onclick = () => toggleBlue(i);
    blueGrid.appendChild(b);
  }
}
function refreshBalls() {
  redGrid.querySelectorAll('.ball').forEach((b) => b.classList.toggle('on', redSel.has(Number(b.dataset.n))));
  blueGrid.querySelectorAll('.ball').forEach((b) => b.classList.toggle('on', blueSel.has(Number(b.dataset.n))));
  refreshCost();
}
function toggleRed(n) {
  if (redSel.has(n)) { redSel.delete(n); }
  else if (redSel.size < 16) { redSel.add(n); }
  else { setStatus('红球最多选 16 个', 'err'); }
  refreshBalls();
}
function toggleBlue(n) {
  if (blueSel.has(n)) { blueSel.delete(n); }
  else if (blueSel.size < 16) { blueSel.add(n); }
  else { setStatus('蓝球最多选 16 个', 'err'); }
  refreshBalls();
}

function refreshCost() {
  const zhu = zhuCount();
  const mult = currentMult();
  const label = document.getElementById('costLabel');
  const amount = document.getElementById('costAmount');
  const btn = document.getElementById('btnBuy');
  if (zhu === 0) {
    label.innerHTML = '请选择号码（<b>' + redSel.size + '</b> 红 + <b>' + blueSel.size + '</b> 蓝）';
    amount.textContent = '—';
    amount.className = 'cost-amount';
    btn.disabled = true;
    return;
  }
  const totalZhu = zhu * mult;
  const cost = totalZhu * ticketPrice;
  const fushi = (redSel.size > 6 || blueSel.size > 1) ? '（复式）' : '';
  label.innerHTML = '共 <b>' + zhu + '</b> 注' + fushi + ' × <b>' + mult + '</b> 倍 = <b>' + totalZhu + '</b> 注';
  amount.textContent = '$' + cost.toFixed(2);
  amount.className = 'cost-amount';
  btn.disabled = false;
}
function currentMult() {
  let m = parseInt(document.getElementById('mult').value, 10);
  if (!(m >= 1)) m = 1;
  if (m > maxMult) m = maxMult;
  return m;
}

function setStatus(t, cls) {
  const s = document.getElementById('status');
  s.textContent = t;
  s.className = 'status' + (cls ? ' ' + cls : '');
}

// 机选一注：随机 6 红 + 1 蓝
function autoPickOne() {
  redSel.clear(); blueSel.clear();
  const rs = new Set();
  while (rs.size < 6) rs.add(1 + Math.floor(Math.random() * 33));
  redSel = rs;
  blueSel = new Set([1 + Math.floor(Math.random() * 16)]);
  refreshBalls();
  setStatus('已机选一注，可继续调整或直接购票');
}
// 机选五注：生成 5 注（每注 6 红 + 1 蓝），若红球集合超过 16 则取前 16
function autoPickFive() {
  redSel.clear(); blueSel.clear();
  const rs = new Set();
  while (rs.size < Math.min(16, 5 * 6)) {
    const cand = new Set();
    while (cand.size < 6) cand.add(1 + Math.floor(Math.random() * 33));
    for (const x of cand) { if (rs.size < 16) rs.add(x); }
  }
  redSel = rs;
  const bs = new Set();
  for (let i = 0; i < 5; i++) bs.add(1 + Math.floor(Math.random() * 16));
  blueSel = bs;
  refreshBalls();
  setStatus('已机选 5 注（复式票），可继续调整或直接购票');
}

async function loadInfo() {
  try {
    const j = await (await fetch('/api/lottery/info')).json();
    ticketPrice = j.ticketPrice; maxMult = j.maxMult; quotaPerUnit = j.quotaPerUnit;
    drawAt = j.drawAt; jackpot = j.jackpot;
    document.getElementById('jackpotVal').textContent = '$' + (jackpot / quotaPerUnit).toFixed(2);
    document.getElementById('curIssue').textContent = j.currentIssue;
    document.getElementById('ticketPrice').textContent = '$' + ticketPrice;
    document.getElementById('drawTime').textContent = j.drawTime;
    document.getElementById('issueBadge').textContent = '第 ' + j.currentIssue + ' 期 · ' + j.drawTime + ' 开奖';
    document.getElementById('mult').max = maxMult;
    buildMultQuick();
    renderPrizeTable(j.prizeTable);
    if (j.latest) renderLatest(j.latest);
    if (j.enabled === false) setStatus('彩票已暂停销售', 'err');
  } catch (e) { setStatus('加载配置失败', 'err'); }
}
function buildMultQuick() {
  const box = document.getElementById('multQuick');
  box.innerHTML = '';
  [1, 2, 5, 10, 50, 99].forEach((m) => {
    if (m > maxMult) return;
    const b = document.createElement('button');
    b.textContent = m + '倍';
    b.onclick = () => { document.getElementById('mult').value = m; refreshMultQuick(); refreshCost(); };
    box.appendChild(b);
  });
}
function refreshMultQuick() {
  const cur = currentMult();
  document.querySelectorAll('#multQuick button').forEach((b) => b.classList.toggle('on', b.textContent === cur + '倍'));
}
function renderPrizeTable(table) {
  document.getElementById('prizeBody').innerHTML = (table || []).map((p) =>
    '<tr><td><span class="tier-badge t' + p.tier + '">' + p.tier + '</span> ' + p.name + '</td><td>' + p.cond + '</td><td>' + p.prize + '</td></tr>'
  ).join('');
}
function ballSpan(n, kind) {
  return '<span class="win-ball ' + kind + '">' + n + '</span>';
}
function renderLatest(l) {
  document.getElementById('latestCard').style.display = 'block';
  document.getElementById('latestIssue').textContent = '第 ' + l.issue + ' 期';
  let html = '';
  (l.red || []).forEach((n) => { html += ballSpan(n, 'r'); });
  html += ballSpan(l.blue, 'b');
  document.getElementById('latestNums').innerHTML = html;
}

async function loadMy() {
  const token = GCAuth.getToken();
  const box = document.getElementById('myTickets');
  if (!token) { box.innerHTML = '<div class="muted-empty">登录后查看当前期及上期彩票</div>'; return; }
  try {
    const j = await (await fetch('/api/lottery/my?token=' + encodeURIComponent(token))).json();
    if (!j.list || !j.list.length) { box.innerHTML = '<div class="muted-empty">本期暂无购票，快去选号吧</div>'; return; }
    box.innerHTML = '';
    j.list.forEach((t) => box.appendChild(renderTicket(t)));
  } catch (e) { box.innerHTML = '<div class="muted-empty">加载失败</div>'; }
}
function renderTicket(t) {
  const el = document.createElement('div');
  el.className = 'ticket';
  let nums = '';
  (t.red || []).forEach((n) => { nums += '<span class="n r">' + n + '</span>'; });
  nums += '<span class="plus">+</span>';
  (t.blue || []).forEach((n) => { nums += '<span class="n b">' + n + '</span>'; });
  let winHtml = '';
  if (t.result) {
    const prizeUsd = t.result.prize / quotaPerUnit;
    if (t.result.prize > 0) {
      const tiers = t.result.tiers || {};
      const tierNames = Object.keys(tiers).map((k) => '×' + k + ' 等奖').join('、');
      const t1 = t.result.tier1Zhu > 0 ? '一等奖 ' + t.result.tier1Zhu + ' 注' : '';
      winHtml = '<div class="t-win win">🎉 中奖 $' + prizeUsd.toFixed(2) + (t1 || tierNames ? '（' + [t1, tierNames].filter(Boolean).join('、') + '）' : '') + '</div>';
    } else {
      winHtml = '<div class="t-win lose">未中奖</div>';
    }
  }
  el.innerHTML =
    '<div class="t-top"><b>第 ' + t.issue + ' 期</b><span class="t-meta" style="margin:0">' + t.zhu + ' 注 × ' + t.mult + ' 倍</span></div>' +
    '<div class="t-nums">' + nums + '</div>' +
    '<div class="t-meta">投注 $' + (t.costQuota / quotaPerUnit).toFixed(2) + (t.result ? ' · 奖金 ' + (t.result.prize > 0 ? '$' + (t.result.prize / quotaPerUnit).toFixed(2) : '$0') : '') + '</div>' +
    winHtml;
  return el;
}

async function loadHistory() {
  const box = document.getElementById('history');
  try {
    const j = await (await fetch('/api/lottery/history?limit=10')).json();
    if (!j.list || !j.list.length) { box.innerHTML = '<div class="muted-empty">暂无开奖记录</div>'; return; }
    box.innerHTML = '';
    j.list.forEach((h) => {
      const row = document.createElement('div');
      row.className = 'hist-row';
      let nums = '';
      (h.red || []).forEach((n) => { nums += '<span class="win-ball r">' + n + '</span>'; });
      nums += '<span class="win-ball b">' + h.blue + '</span>';
      row.innerHTML = '<span class="issue">' + h.issue + '</span>' + nums +
        '<span style="color:var(--muted)">一等奖 ' + (h.tier1Zhu || 0) + ' 注 · 奖池 $' + ((h.jackpot || 0) / quotaPerUnit).toFixed(2) + '</span>';
      box.appendChild(row);
    });
  } catch (e) { box.innerHTML = '<div class="muted-empty">加载失败</div>'; }
}

// 倒计时
function tickCountdown() {
  if (!drawAt) return;
  const diff = drawAt - Date.now();
  const el = document.getElementById('countdown');
  if (diff <= 0) { el.textContent = '开奖中…'; setTimeout(loadInfo, 5000); return; }
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  el.textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

async function buy() {
  if (busy) return;
  const token = GCAuth.getToken();
  if (!token) { alert('请先登录 NewAPI 账号'); return; }
  const zhu = zhuCount();
  if (!zhu) { alert('请至少选择 6 个红球 + 1 个蓝球'); return; }
  const mult = currentMult();
  const totalZhu = zhu * mult;
  if (!confirm('确认购买 ' + totalZhu + ' 注（$' + (totalZhu * ticketPrice).toFixed(2) + '）？')) return;
  busy = true;
  document.getElementById('btnBuy').disabled = true;
  setStatus('购票中…', 'turn');
  try {
    const r = await fetch('/api/lottery/buy', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, red: Array.from(redSel), blue: Array.from(blueSel), mult }),
    });
    const j = await r.json();
    if (j.code !== 'ok') { setStatus(j.error || '购票失败', 'err'); return; }
    setStatus('✅ 购票成功！第 ' + j.issue + ' 期，共 ' + j.zhu * j.mult + ' 注');
    jackpot = j.jackpot;
    document.getElementById('jackpotVal').textContent = '$' + (jackpot / quotaPerUnit).toFixed(2);
    redSel.clear(); blueSel.clear(); refreshBalls();
    document.getElementById('mult').value = 1; refreshMultQuick();
    loadMy();
  } catch (e) {
    setStatus('网络错误，请稍后重试', 'err');
  } finally {
    busy = false;
    document.getElementById('btnBuy').disabled = false;
  }
}

document.getElementById('btnAuto1').onclick = autoPickOne;
document.getElementById('btnAuto5').onclick = autoPickFive;
document.getElementById('btnClear').onclick = () => { redSel.clear(); blueSel.clear(); refreshBalls(); setStatus('已清空'); };
document.getElementById('mult').oninput = () => { refreshMultQuick(); refreshCost(); };
document.getElementById('btnBuy').onclick = buy;

GCAuth.renderAuthBar(document.getElementById('authBar'), () => loadMy());

buildBalls();
refreshBalls();
loadInfo();
loadHistory();
loadMy();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>
