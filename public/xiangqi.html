<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中国象棋对战</title>
<link rel="stylesheet" href="/css/style.css">
<style>
#board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  width: min(520px, 92vw);
  aspect-ratio: 9 / 11;
  background: #d9b98a;
  border: 2px solid #8a5a2b;
  border-radius: 6px;
  overflow: hidden;
  user-select: none;
}
#boardDecor {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.cell {
  position: relative;
  border-right: 1px solid rgba(138,90,43,.35);
  border-bottom: 1px solid rgba(138,90,43,.35);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.cell:nth-child(9n) { border-right: none; }
.river {
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: center;
  gap: 30px; font-size: 15px; font-weight: 700; color: #8a5a2b;
  letter-spacing: 2px; border-bottom: 1px solid rgba(138,90,43,.35);
  background: rgba(255,255,255,.15);
}
.piece {
  width: 78%; height: 78%;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(13px, 3.4vw, 19px); font-weight: 700;
  border: 2px solid #5a3a18;
  background: radial-gradient(circle at 35% 30%, #fff6e6, #f3dfae);
  color: #a32822;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  pointer-events: none;
}
.piece.black { color: #23272f; }
.cell.selected { background: rgba(108,124,255,.35); }
.cell.target { background: rgba(62,207,142,.45); }
.cell.target::after {
  content: ''; position: absolute; width: 26%; height: 26%;
  border-radius: 50%; background: rgba(62,207,142,.8);
}
.cell.last-from { background: rgba(255, 205, 0, .35); }
.cell.last-to { background: rgba(255, 138, 26, .40); }
.cell.last-to::after {
  content: ''; position: absolute; width: 30%; height: 30%;
  border-radius: 50%; background: rgba(224, 70, 60, .8);
  box-shadow: 0 0 0 2px rgba(255,255,255,.5);
}
.timer { text-align: center; font-size: 13px; color: var(--gold); margin-top: 8px; font-variant-numeric: tabular-nums; min-height: 20px; }
.timer.urgent { color: var(--red); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-btn" href="/" id="backBtn">← 大厅</a>
      <div class="title">♟️ 中国象棋</div>
    </div>
    <span class="badge" id="betBadge"></span>
  </div>
  <div id="authBar"></div>
  <div class="card">
    <div class="meta" id="meta"></div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="timer" id="timer"></div>
    <div class="panel" id="panel" style="display:none">
      <div id="codeBox" style="display:none">
        <div class="row">
          <input id="roomCode" type="text" placeholder="输入房间码（如 ABC123）" maxlength="6" autocomplete="off">
        </div>
        <button id="btnJoin" class="primary">凭房间码进入对战</button>
        <div class="tip">房间码由机器人在匹配成功后私聊发送，请先用已绑定的 NewAPI 账号登录。</div>
      </div>
    </div>
    <div class="actions">
      <button id="btnResign" class="danger" style="display:none">认输</button>
      <button id="btnReconnect" class="primary" style="display:none">重新连接</button>
    </div>
    <div class="status" id="status">加载中…</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="result" id="resultTitle"></div>
    <div class="detail" id="resultDetail"></div>
    <button class="primary" onclick="location.reload()">关闭</button>
  </div>
</div>

<script src="/js/auth.js"></script>
<script src="/js/xiangqi.js"></script>
<script>
const params = new URLSearchParams(location.search);
const roomId = params.get('room');
const player = parseInt(params.get('player'), 10);
const token = params.get('token');
const gid = params.get('gid');
document.getElementById('backBtn').href = '/' + (gid ? '?gid=' + encodeURIComponent(gid) : '');

const PIECES = {
  k: ['帅', '将'], a: ['仕', '士'], b: ['相', '象'], n: ['马', '马'],
  r: ['车', '车'], c: ['炮', '炮'], p: ['兵', '卒'],
};

let xq = null;
let ws = null;
let myTurn = false;
let myPlayer = player;
let myColor = player === 1 ? 'r' : 'b';
let selectedFrom = null;
let legalTo = new Set();
let lastMove = null;   // 上一步落子 {from:{row,col}, to:{row,col}}，用于高亮对方/自己刚走的一步

const GAME_TYPE = 'xiangqi';
let curRid = null, curPl = null, curTk = null;   // 当前对局连接信息（用于重连）
let deadline = null, timeoutMs = 180000, timerInterval = null; // 思考倒计时
let gameOver = false;   // 对局是否已结束（结束则不再自动重连）
let fatalError = false; // 鉴权失败/房间不可用等致命错误（不自动重连）
let reconnectTimer = null;

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const metaEl = document.getElementById('meta');
const betBadge = document.getElementById('betBadge');
const panelEl = document.getElementById('panel');
const codeBox = document.getElementById('codeBox');
const btnResign = document.getElementById('btnResign');

function algebraicToRC(sq) {
  return { row: 9 - (sq.charCodeAt(1) - 48), col: sq.charCodeAt(0) - 97 };
}
function rcToAlgebraic(row, col) {
  return 'abcdefghi'[col] + (9 - row);
}

// 棋盘装饰层：九宫斜线 + 兵/卒/炮位十字标记（viewBox 0 0 9 11，与棋盘 grid 对齐）
const boardDecorSVG = (() => {
  const marks = [];
  const cross = (cx, cy) =>
    `<path d="M ${(cx - 0.18).toFixed(3)} ${cy} H ${(cx + 0.18).toFixed(3)} M ${cx} ${(cy - 0.18).toFixed(3)} V ${(cy + 0.18).toFixed(3)}" stroke="#8a5a2b" stroke-width="0.05" fill="none"/>`;
  // 兵/卒位：file 0,2,4,6,8；黑卒 row3（y 中心 3.5）、红兵 row6（y 中心 7.5）
  for (const c of [0, 2, 4, 6, 8]) { marks.push(cross(c + 0.5, 3.5), cross(c + 0.5, 7.5)); }
  // 炮位：file 1,7；黑炮 row2（y 中心 2.5）、红炮 row7（y 中心 8.5）
  for (const c of [1, 7]) { marks.push(cross(c + 0.5, 2.5), cross(c + 0.5, 8.5)); }
  return '<svg id="boardDecor" viewBox="0 0 9 11" preserveAspectRatio="none">' +
    '<line x1="3" y1="0" x2="6" y2="3" stroke="#8a5a2b" stroke-width="0.06"/>' +
    '<line x1="6" y1="0" x2="3" y2="3" stroke="#8a5a2b" stroke-width="0.06"/>' +
    '<line x1="3" y1="8" x2="6" y2="11" stroke="#8a5a2b" stroke-width="0.06"/>' +
    '<line x1="6" y1="8" x2="3" y2="11" stroke="#8a5a2b" stroke-width="0.06"/>' +
    marks.join('') + '</svg>';
})();

function render() {
  const b = xq.board();
  boardEl.innerHTML = boardDecorSVG;
  for (let gr = 0; gr < 11; gr++) {
    if (gr === 5) {
      const river = document.createElement('div');
      river.className = 'river';
      river.textContent = '楚 河　·　汉 界';
      boardEl.appendChild(river);
      continue;
    }
    const row = gr < 5 ? gr : gr - 1;
    for (let col = 0; col < 9; col++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const p = b[row][col];
      if (p) {
        const piece = document.createElement('div');
        piece.className = 'piece ' + (p.color === 'r' ? 'red' : 'black');
        piece.textContent = PIECES[p.type][p.color === 'r' ? 0 : 1];
        cell.appendChild(piece);
      }
      if (selectedFrom && selectedFrom.row === row && selectedFrom.col === col) {
        cell.classList.add('selected');
      }
      if (legalTo.has(col + ',' + row)) {
        cell.classList.add('target');
      }
      if (lastMove) {
        if (lastMove.from.row === row && lastMove.from.col === col) cell.classList.add('last-from');
        if (lastMove.to.row === row && lastMove.to.col === col) cell.classList.add('last-to');
      }
      cell.addEventListener('click', () => onClickCell(row, col));
      boardEl.appendChild(cell);
    }
  }
}

function onClickCell(row, col) {
  if (!xq || !ws) return;
  const b = xq.board();
  const p = b[row][col];
  const isMyPiece = p && p.color === myColor;

  if (selectedFrom) {
    if (legalTo.has(col + ',' + row)) {
      const from = rcToAlgebraic(selectedFrom.row, selectedFrom.col);
      const to = rcToAlgebraic(row, col);
      const res = xq.move({ from, to });
      if (res) {
        lastMove = { from: { row: selectedFrom.row, col: selectedFrom.col }, to: { row, col } };
        ws.send(JSON.stringify({ type: 'move', move: { from, to } }));
        selectedFrom = null; legalTo = new Set();
        render();
        setTurn(false);
        return;
      }
    }
    selectedFrom = null; legalTo = new Set();
  }

  if (isMyPiece && myTurn) {
    selectedFrom = { row, col };
    const moves = xq.moves({ verbose: true });
    legalTo = new Set();
    for (const m of moves) {
      if (m.from === rcToAlgebraic(row, col)) {
        const t = algebraicToRC(m.to);
        legalTo.add(t.col + ',' + t.row);
      }
    }
  }
  render();
}

function setTurn(my) {
  myTurn = my;
  if (my) {
    statusEl.textContent = '轮到你走棋';
    statusEl.className = 'status turn';
  } else {
    statusEl.textContent = '等待对方走棋…';
    statusEl.className = 'status';
  }
  updateTimer();
}

// ---- 思考倒计时 ----
function updateTimer() {
  const el = document.getElementById('timer');
  if (deadline == null) { el.textContent = ''; return; }
  const remain = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
  const who = myTurn ? '你' : '对方';
  if (remain <= 0) {
    el.textContent = '⏱ ' + who + '思考超时，人机代走中…';
    el.className = 'timer urgent';
  } else {
    el.textContent = '⏱ ' + who + '思考剩余 ' + remain + ' 秒';
    el.className = 'timer' + (remain <= 30 ? ' urgent' : '');
  }
}
function startTimer(dl, tmo) {
  deadline = dl; timeoutMs = tmo || 180000;
  if (timerInterval) clearInterval(timerInterval);
  updateTimer();
  timerInterval = setInterval(updateTimer, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  deadline = null;
  const el = document.getElementById('timer');
  if (el) el.textContent = '';
}

function showResult(winner, reason) {
  const t = document.getElementById('resultTitle');
  const d = document.getElementById('resultDetail');
  if (winner === 0) {
    t.textContent = '平局';
    t.className = 'result draw';
  } else if (winner === myPlayer) {
    t.textContent = '🎉 你赢了';
    t.className = 'result win';
  } else {
    t.textContent = '你输了';
    t.className = 'result lose';
  }
  d.innerHTML = '对局结束：' + reason + '<br>额度已自动结算，结果将同步回群里';
  document.getElementById('overlay').classList.add('show');
}

function connectWS(rid, pl, tk) {
  myPlayer = pl;
  myColor = pl === 1 ? 'r' : 'b';
  curRid = rid; curPl = pl; curTk = tk;
  ws = new WebSocket(
    (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host +
    '/ws?room=' + rid + '&player=' + pl + '&token=' + tk
  );
  ws.onopen = () => { statusEl.textContent = '已连接，等待开始…'; };
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'hello') {
      gameOver = false; fatalError = false;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      betBadge.textContent = '押注 $' + msg.bet;
      metaEl.innerHTML =
        '你：<b>' + (msg.you.name || msg.you.qq) + '</b>（' + (myPlayer === 1 ? '红方先手' : '黑方') + '）' +
        '　vs　对手：<b>' + (msg.opponent.name || msg.opponent.qq) + '</b>';
      xq = msg.state && msg.state.fen ? new Xiangqi(msg.state.fen) : new Xiangqi();
      lastMove = null; // 重连后无历史步信息，清空上一步高亮
      render();
      setTurn((msg.state.turn || 1) === myPlayer);
      startTimer(msg.deadline, msg.timeoutMs);
      GCAuth.saveBattle(GAME_TYPE, curRid, curPl, curTk);
      panelEl.style.display = 'none';
      btnResign.style.display = 'inline-block';
      document.getElementById('btnReconnect').style.display = 'none';
    } else if (msg.type === 'move') {
      xq.move({ from: msg.move.from, to: msg.move.to });
      lastMove = { from: algebraicToRC(msg.move.from), to: algebraicToRC(msg.move.to) };
      selectedFrom = null; legalTo = new Set();
      render();
      setTurn(msg.turn === myPlayer);
      startTimer(msg.deadline, msg.timeoutMs);
      if (msg.auto) {
        const who = msg.autoPlayer === myPlayer ? '你' : '对方';
        statusEl.textContent = '⚠ ' + who + '思考超时，人机代走一步';
        statusEl.className = 'status';
      }
    } else if (msg.type === 'end') {
      gameOver = true;
      stopTimer();
      GCAuth.clearBattle(GAME_TYPE);
      showResult(msg.winner, msg.reason);
    } else if (msg.type === 'error') {
      fatalError = true;
      statusEl.textContent = msg.message || '出错了';
      statusEl.className = 'status';
    }
  };
  ws.onclose = () => {
    stopTimer();
    if (gameOver || fatalError) return; // 对局已结束或鉴权失败，不再自动重连
    document.getElementById('btnReconnect').style.display = 'inline-block';
    statusEl.textContent = '连接已断开，正在自动重连…';
    statusEl.className = 'status';
    if (reconnectTimer) clearTimeout(reconnectTimer);
    reconnectTimer = setTimeout(() => {
      if (!gameOver && !fatalError && curRid && curTk) connectWS(curRid, curPl, curTk);
    }, 2000);
  };
}

async function postJSON(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

// ---- 凭房间码进入对战 ----
async function joinByCode() {
  const token = GCAuth.getToken();
  if (!token) { alert('请先登录 NewAPI 账号'); return; }
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!code) { alert('请输入房间码'); return; }
  const d = await postJSON('/api/room/join-by-code', { code, token });
  if (d.code !== 'ok') { alert(d.error || '进入失败'); return; }
  if (d.gameType !== GAME_TYPE) {
    // 房间码属于另一种游戏，跳转到对应游戏页并自动进入
    GCAuth.saveBattle(d.gameType, d.roomId, d.player, d.wsToken);
    location.href = '/' + d.gameType + '.html';
    return;
  }
  GCAuth.saveBattle(GAME_TYPE, d.roomId, d.player, d.wsToken);
  connectWS(d.roomId, d.player, d.wsToken);
}

document.getElementById('btnJoin').onclick = joinByCode;
btnResign.onclick = () => {
  if (confirm('确定认输吗？')) ws.send(JSON.stringify({ type: 'resign' }));
};
document.getElementById('btnReconnect').onclick = () => {
  if (curRid && curTk) {
    document.getElementById('btnReconnect').style.display = 'none';
    connectWS(curRid, curPl, curTk);
  }
};

// 登录条
GCAuth.renderAuthBar(document.getElementById('authBar'));

// ---- 初始化：按模式（含退出重进恢复） ----
async function init() {
  // 1) URL 带 token：正常对战（兼容旧链接，仍可用）
  if (roomId && token) { connectWS(roomId, player, token); return; }

  // 2) 重连：本地保存了对局 token 且房间仍在进行中
  const saved = GCAuth.loadBattle(GAME_TYPE);
  if (saved && saved.token) {
    try {
      const r = await fetch('/api/room/' + saved.roomId);
      const j = await r.json();
      if (j.state === 'playing') { connectWS(saved.roomId, saved.player, saved.token); return; }
    } catch (e) { /* 网络异常按无对战处理 */ }
    GCAuth.clearBattle(GAME_TYPE);
  }

  // 3) 预览 + 房间码入口
  xq = new Xiangqi();
  render();
  betBadge.textContent = '演示';
  metaEl.textContent = '中国象棋 · 红方先手（楚河汉界）';
  panelEl.style.display = 'flex';
  codeBox.style.display = 'flex';
  statusEl.textContent = '登录后输入机器人私聊的房间码进入对战';
  statusEl.className = 'status';
}
init();
</script>
</body>
</html>
