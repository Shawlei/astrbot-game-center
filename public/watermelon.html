<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>合成大西瓜</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  :root { --wm-accent: #ff8f3c; }
  .game-wrap { display: flex; justify-content: center; margin: 4px 0 0; }
  #board {
    display: block; width: 100%; max-width: 400px; height: auto;
    background: linear-gradient(180deg, #1a1f2e 0%, #141824 30%, #12151f 100%);
    border: 1px solid var(--border); border-radius: 14px;
    touch-action: none; user-select: none; -webkit-user-select: none;
    cursor: crosshair;
  }
  .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0 4px; flex-wrap: wrap; }
  .hud .score-box { text-align: left; }
  .hud .score-box .s-label { font-size: 11px; color: var(--muted); letter-spacing: .5px; }
  .hud .score-box .s-val { font-size: 26px; font-weight: 800; color: var(--text); line-height: 1.1; }
  .hud .next-box { display: flex; align-items: center; gap: 8px; }
  .hud .next-box .n-label { font-size: 11px; color: var(--muted); text-align: right; }
  .hud canvas#nextCv { width: 44px; height: 44px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; }
  .hud .max-box { text-align: center; }
  .hud .max-box .m-label { font-size: 11px; color: var(--muted); }
  .hud .max-box .m-val { font-size: 15px; font-weight: 700; color: var(--accent); }
  .wm-tip { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 8px; }
  .wm-tip b { color: var(--text); }
  .reward-hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <a class="back-btn" href="/" id="backBtn">← 大厅</a>
      <div class="title">🍉 合成大西瓜</div>
    </div>
    <span class="badge" id="gameBadge">免费玩 · 按得分发额度</span>
  </div>
  <div id="authBar"></div>
  <div class="card">
    <div class="meta">两个相同的水果碰撞会合成更大的水果，一路合到西瓜！免费畅玩，合成到 <b>菠萝(9级)</b> 及以上即可领额度，<b>奖励按本局得分计算</b>（每日封顶）。</div>

    <div class="hud">
      <div class="score-box">
        <div class="s-label">得分</div>
        <div class="s-val" id="score">0</div>
      </div>
      <div class="max-box">
        <div class="m-label">最高合成</div>
        <div class="m-val" id="maxLv">—</div>
      </div>
      <div class="next-box">
        <div>
          <div class="n-label">下一个</div>
        </div>
        <canvas id="nextCv" width="44" height="44"></canvas>
      </div>
    </div>

    <div class="game-wrap">
      <canvas id="board" width="400" height="620"></canvas>
    </div>

    <div class="panel" id="panel">
      <div class="row">
        <button id="btnStart" class="primary">开始游戏</button>
        <button id="btnEnd" class="danger" style="display:none">结束并结算</button>
      </div>
      <div class="wm-tip">操作：<b>左右移动</b>鼠标 / 手指定位，<b>点击 / 松手</b>放下水果。合成到 <b>菠萝(9级)</b> 及以上才能领奖，奖励按本局得分结算（约每 400 分 $1，单局保底 $0.5、封顶 $5）。</div>
    </div>

    <div class="result-box" id="result" style="display:none"></div>
    <div class="status" id="status">登录后点「开始游戏」（未登录也可免费试玩，但无法领取额度）</div>
  </div>
</div>

<script src="/js/auth.js"></script>
<script>
const params = new URLSearchParams(location.search);
const gid = params.get('gid');
document.getElementById('backBtn').href = '/' + (gid ? '?gid=' + encodeURIComponent(gid) : '');

// ---- 常量（与 11 级水果） ----
const W = 400, H = 620;
const RADII = [0, 26, 32, 40, 48, 58, 68, 80, 94, 110, 130, 156];
const NAMES = ['', '樱桃', '草莓', '葡萄', '橙子', '柿子', '苹果', '梨', '桃子', '菠萝', '蜜瓜', '西瓜'];
const SCORE = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
const DEATH_Y = 112;          // 警戒线（顶部）
const GRAVITY = 0.72;
const REST = 0.16;            // 碰撞恢复系数
const FRICTION = 0.985;       // 水平摩擦
const DAMP = 0.996;           // 速度阻尼

const board = document.getElementById('board');
const ctx = board.getContext('2d');
const nextCv = document.getElementById('nextCv');
const nctx = nextCv.getContext('2d');
const scoreEl = document.getElementById('score');
const maxLvEl = document.getElementById('maxLv');
const resultEl = document.getElementById('result');
const statusEl = document.getElementById('status');

const dpr = Math.min(window.devicePixelRatio || 1, 2);
board.width = W * dpr; board.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

let quotaPerUnit = 500000;
fetch('/api/health').then((r) => r.json()).then((j) => { if (j.quotaPerUnit) quotaPerUnit = j.quotaPerUnit; }).catch(() => {});

GCAuth.renderAuthBar(document.getElementById('authBar'));

// ---- 游戏状态 ----
let fruits = [];      // {level, x, y, vx, vy, age}
let particles = [];   // 合成特效
let current = null;   // 当前待放下的水果 {level, x, y}
let nextLevel = 1;
let score = 0, maxLevel = 0;
let running = false, over = false;
let danger = 0;       // 警戒累计（秒）
let lastT = 0;

function radius(level) { return RADII[level] || 26; }
function randLevel() { const r = Math.random(); return r < 0.30 ? 1 : r < 0.55 ? 2 : r < 0.75 ? 3 : r < 0.90 ? 4 : 5; }

function setStatus(t, cls) { statusEl.textContent = t; statusEl.className = 'status' + (cls ? ' ' + cls : ''); }

// ---- 水果绘制 ----
function fruitPalette(level) {
  switch (level) {
    case 1:  return { c1: '#ff8a80', c2: '#ff5252', c3: '#c62828', leaf: '#66bb6a' }; // 樱桃
    case 2:  return { c1: '#ff5f66', c2: '#ef3b46', c3: '#c0182b', leaf: '#43a047' }; // 草莓
    case 3:  return { c1: '#dcb0f5', c2: '#a66bd6', c3: '#6f3598', leaf: '#8bc34a' }; // 葡萄
    case 4:  return { c1: '#ffd180', c2: '#ffa726', c3: '#e8600c', leaf: '#66bb6a' }; // 橙子
    case 5:  return { c1: '#ffb74d', c2: '#ff8a3c', c3: '#df5a00', leaf: '#558b2f' }; // 柿子
    case 6:  return { c1: '#ff8a80', c2: '#ef5350', c3: '#b71c1c', leaf: '#689f38' }; // 苹果
    case 7:  return { c1: '#fff59d', c2: '#e6d84c', c3: '#a99a0e', leaf: '#66bb6a' }; // 梨
    case 8:  return { c1: '#ffd0bd', c2: '#ff9c80', c3: '#ef5350', leaf: '#66bb6a' }; // 桃子
    case 9:  return { c1: '#ffe082', c2: '#ffc107', c3: '#d98e00', leaf: '#2e7d32' }; // 菠萝
    case 10: return { c1: '#e3f2c1', c2: '#aed581', c3: '#5e8e33', leaf: '#33691e' }; // 蜜瓜
    case 11: return { c1: '#81c784', c2: '#43a047', c3: '#1b5e20', leaf: '#1b5e20' }; // 西瓜
    default: return { c1: '#bbb', c2: '#999', c3: '#666', leaf: '#8bc34a' };
  }
}

// 心形（草莓 / 桃子主体）
function heartPath(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y + r * 0.95);
  c.bezierCurveTo(x - r * 1.15, y + r * 0.12, x - r * 0.85, y - r * 0.98, x, y - r * 0.26);
  c.bezierCurveTo(x + r * 0.85, y - r * 0.98, x + r * 1.15, y + r * 0.12, x, y + r * 0.95);
  c.closePath();
}

// 梨形（上窄下宽）
function pearPath(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y - r);
  c.bezierCurveTo(x + r * 0.58, y - r * 0.72, x + r * 0.78, y - r * 0.28, x + r * 0.64, y + r * 0.42);
  c.bezierCurveTo(x + r * 0.55, y + r * 0.98, x - r * 0.55, y + r * 0.98, x - r * 0.64, y + r * 0.42);
  c.bezierCurveTo(x - r * 0.78, y - r * 0.28, x - r * 0.58, y - r * 0.72, x, y - r);
  c.closePath();
}

// 顶部叶冠（草莓 / 菠萝共用）
function leafCrown(c, x, y, s, color) {
  c.fillStyle = color;
  for (let i = -2; i <= 2; i++) {
    c.beginPath();
    c.moveTo(x, y);
    c.quadraticCurveTo(x + i * s * 0.6, y - s * 1.5, x + i * s * 1.1, y - s * 0.8);
    c.quadraticCurveTo(x + i * s * 0.4, y - s * 0.3, x, y);
    c.fill();
  }
}

// 通用圆体：多层渐变 + 描边 + 边缘内发光 + 高光 + 反光点
function roundBody(c, x, y, r, P) {
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.1, x, y, r * 1.02);
  g.addColorStop(0, P.c1);
  g.addColorStop(0.55, P.c2);
  g.addColorStop(1, P.c3);
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.22)';
  c.lineWidth = Math.max(1, r * 0.04);
  c.stroke();
  const eg = c.createRadialGradient(x, y, r * 0.55, x, y, r);
  eg.addColorStop(0, 'rgba(0,0,0,0)');
  eg.addColorStop(1, 'rgba(0,0,0,.18)');
  c.fillStyle = eg;
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.65)';
  c.beginPath();
  c.ellipse(x - r * 0.34, y - r * 0.44, r * 0.30, r * 0.16, -0.6, 0, Math.PI * 2);
  c.fill();
  c.fillStyle = 'rgba(255,255,255,.9)';
  c.beginPath(); c.arc(x - r * 0.44, y - r * 0.52, r * 0.055, 0, Math.PI * 2); c.fill();
}

function drawCherry(c, x, y, r, P) {
  const off = r * 0.34, br = r * 0.68, by = y + r * 0.08;
  c.strokeStyle = '#5d4037';
  c.lineWidth = Math.max(1.5, r * 0.09);
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x - off, y - r * 0.25);
  c.quadraticCurveTo(x, y - r * 1.15, x + off, y - r * 0.25);
  c.stroke();
  roundBody(c, x - off, by, br, P);
  roundBody(c, x + off, by, br, P);
  c.fillStyle = P.leaf;
  c.beginPath();
  c.ellipse(x, y - r * 1.05, r * 0.32, r * 0.13, -0.4, 0, Math.PI * 2);
  c.fill();
}

function drawStrawberry(c, x, y, r, P) {
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.1, x, y + r * 0.1, r * 1.2);
  g.addColorStop(0, P.c1); g.addColorStop(0.5, P.c2); g.addColorStop(1, P.c3);
  c.fillStyle = g;
  heartPath(c, x, y + r * 0.06, r * 1.0);
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,.22)';
  c.lineWidth = Math.max(1, r * 0.04);
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)';
  c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.34, r * 0.2, r * 0.11, -0.55, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,235,170,.92)';
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + 0.3;
    const px = x + Math.cos(a) * r * 0.5;
    const py = y + Math.sin(a) * r * 0.8 * 0.5 + r * 0.05;
    c.beginPath(); c.ellipse(px, py, r * 0.045, r * 0.06, a, 0, Math.PI * 2); c.fill();
  }
  leafCrown(c, x, y - r * 0.42, r * 0.5, P.leaf);
}

function drawPear(c, x, y, r, P) {
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y + r * 0.15, r * 1.15);
  g.addColorStop(0, P.c1); g.addColorStop(0.55, P.c2); g.addColorStop(1, P.c3);
  c.fillStyle = g;
  pearPath(c, x, y, r);
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,.2)';
  c.lineWidth = Math.max(1, r * 0.04);
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.6)';
  c.beginPath(); c.ellipse(x - r * 0.32, y - r * 0.45, r * 0.24, r * 0.13, -0.5, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(150,130,20,.35)';
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + 0.7;
    c.beginPath(); c.arc(x + Math.cos(a) * r * 0.45, y + Math.sin(a) * r * 0.4 + r * 0.2, r * 0.035, 0, Math.PI * 2); c.fill();
  }
  c.strokeStyle = '#6d4c41';
  c.lineWidth = Math.max(1.2, r * 0.06);
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x, y - r * 0.85);
  c.quadraticCurveTo(x + r * 0.1, y - r * 1.15, x + r * 0.18, y - r * 1.1);
  c.stroke();
}

function drawPeach(c, x, y, r, P) {
  const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y + r * 0.1, r * 1.15);
  g.addColorStop(0, P.c1); g.addColorStop(0.5, P.c2); g.addColorStop(1, P.c3);
  c.fillStyle = g;
  heartPath(c, x, y + r * 0.04, r * 0.98);
  c.fill();
  c.strokeStyle = 'rgba(0,0,0,.2)';
  c.lineWidth = Math.max(1, r * 0.04);
  c.stroke();
  c.strokeStyle = 'rgba(170,60,40,.32)';
  c.lineWidth = r * 0.05;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x, y - r * 0.35);
  c.quadraticCurveTo(x + r * 0.14, y + r * 0.12, x, y + r * 0.9);
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.5)';
  c.beginPath(); c.ellipse(x - r * 0.3, y - r * 0.3, r * 0.2, r * 0.11, -0.5, 0, Math.PI * 2); c.fill();
  c.fillStyle = P.leaf;
  c.beginPath(); c.ellipse(x + r * 0.3, y - r * 0.55, r * 0.3, r * 0.11, -0.7, 0, Math.PI * 2); c.fill();
}

function drawPineapple(c, x, y, r, P) {
  const bx = x, by = y + r * 0.06;
  const g = c.createRadialGradient(bx - r * 0.3, by - r * 0.35, r * 0.1, bx, by, r * 1.0);
  g.addColorStop(0, P.c1); g.addColorStop(0.55, P.c2); g.addColorStop(1, P.c3);
  c.fillStyle = g;
  c.beginPath(); c.ellipse(bx, by, r * 0.94, r * 0.88, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.22)';
  c.lineWidth = Math.max(1, r * 0.04);
  c.stroke();
  c.save();
  c.beginPath(); c.ellipse(bx, by, r * 0.94, r * 0.88, 0, 0, Math.PI * 2); c.clip();
  c.strokeStyle = 'rgba(160,100,10,.32)';
  c.lineWidth = Math.max(1, r * 0.025);
  const step = r * 0.30;
  for (let k = -4; k <= 4; k++) {
    c.beginPath(); c.moveTo(bx + k * step - r, by - r); c.lineTo(bx + k * step + r, by + r); c.stroke();
    c.beginPath(); c.moveTo(bx - r, by + k * step + r); c.lineTo(bx + r, by + k * step - r); c.stroke();
  }
  c.restore();
  c.fillStyle = 'rgba(255,255,255,.4)';
  c.beginPath(); c.ellipse(bx - r * 0.3, by - r * 0.4, r * 0.24, r * 0.13, -0.55, 0, Math.PI * 2); c.fill();
  leafCrown(c, bx, by - r * 0.66, r * 0.55, P.leaf);
}

function grapeGloss(c, x, y, r, P) {
  c.fillStyle = '#5d4037';
  c.beginPath(); c.arc(x, y - r * 0.82, r * 0.09, 0, Math.PI * 2); c.fill();
}

function orangeDots(c, x, y, r, P) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.clip();
  c.fillStyle = 'rgba(190,90,10,.22)';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.4;
    const px = x + Math.cos(a) * r * 0.5, py = y + Math.sin(a) * r * 0.5;
    c.beginPath(); c.arc(px, py, r * 0.05, 0, Math.PI * 2); c.fill();
  }
  c.restore();
  c.fillStyle = '#6d4c41';
  c.beginPath(); c.arc(x, y - r * 0.82, r * 0.08, 0, Math.PI * 2); c.fill();
}

function persimmonCalyx(c, x, y, r, P) {
  c.fillStyle = P.leaf;
  c.beginPath(); c.arc(x, y - r * 0.72, r * 0.22, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(46,92,20,.85)';
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 2 + Math.PI / 4;
    c.beginPath();
    c.ellipse(x + Math.cos(a) * r * 0.16, y - r * 0.72 + Math.sin(a) * r * 0.16, r * 0.16, r * 0.08, a, 0, Math.PI * 2);
    c.fill();
  }
}

function appleStalk(c, x, y, r, P) {
  c.strokeStyle = '#6d4c41';
  c.lineWidth = Math.max(1.2, r * 0.06);
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x, y - r * 0.8);
  c.quadraticCurveTo(x + r * 0.18, y - r * 1.15, x + r * 0.3, y - r * 1.05);
  c.stroke();
  c.fillStyle = P.leaf;
  c.beginPath(); c.ellipse(x + r * 0.32, y - r * 1.0, r * 0.26, r * 0.1, -0.6, 0, Math.PI * 2); c.fill();
}

function melonNet(c, x, y, r, P) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.clip();
  c.strokeStyle = 'rgba(70,110,40,.28)';
  c.lineWidth = Math.max(1, r * 0.03);
  for (let k = -3; k <= 3; k++) {
    c.beginPath();
    c.moveTo(x + k * r * 0.28, y - r);
    c.quadraticCurveTo(x + k * r * 0.42, y, x + k * r * 0.28, y + r);
    c.stroke();
  }
  for (let k = -3; k <= 3; k++) {
    c.beginPath();
    c.moveTo(x - r, y + k * r * 0.26);
    c.quadraticCurveTo(x, y + k * r * 0.4, x + r, y + k * r * 0.26);
    c.stroke();
  }
  c.restore();
}

function watermelonStripes(c, x, y, r, P) {
  c.save();
  c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.clip();
  c.strokeStyle = 'rgba(10,60,18,.55)';
  c.lineWidth = r * 0.14;
  c.lineCap = 'round';
  for (let i = -2; i <= 2; i++) {
    const cx = x + i * r * 0.44;
    c.beginPath();
    c.moveTo(cx, y - r);
    c.quadraticCurveTo(cx + i * r * 0.1, y, cx, y + r);
    c.stroke();
  }
  c.restore();
}

function drawFruit(c, x, y, r, level) {
  c.save();
  const P = fruitPalette(level);
  switch (level) {
    case 1: drawCherry(c, x, y, r, P); break;
    case 2: drawStrawberry(c, x, y, r, P); break;
    case 7: drawPear(c, x, y, r, P); break;
    case 8: drawPeach(c, x, y, r, P); break;
    case 9: drawPineapple(c, x, y, r, P); break;
    default: roundBody(c, x, y, r, P); break;
  }
  if (level === 3) grapeGloss(c, x, y, r, P);
  else if (level === 4) orangeDots(c, x, y, r, P);
  else if (level === 5) persimmonCalyx(c, x, y, r, P);
  else if (level === 6) appleStalk(c, x, y, r, P);
  else if (level === 10) melonNet(c, x, y, r, P);
  else if (level === 11) watermelonStripes(c, x, y, r, P);
  c.restore();
}

// ---- 物理 ----
function spawnParticles(x, y, level) {
  const c1 = fruitPalette(level).c2;
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5, life: 1, c: c1, r: 2 + Math.random() * 3 });
  }
}

function step() {
  // 积分
  for (const f of fruits) {
    f.vy += GRAVITY;
    f.x += f.vx;
    f.y += f.vy;
    f.vx *= FRICTION;
    f.vy *= DAMP;
    f.age = (f.age || 0) + 1;
  }
  // 墙壁
  for (const f of fruits) {
    const r = radius(f.level);
    if (f.x < r) { f.x = r; f.vx = Math.abs(f.vx) * REST; }
    if (f.x > W - r) { f.x = W - r; f.vx = -Math.abs(f.vx) * REST; }
    if (f.y > H - r) { f.y = H - r; f.vy = -Math.abs(f.vy) * REST; f.vx *= 0.99; }
    if (f.y < r) { f.y = r; f.vy = Math.abs(f.vy) * REST; }
  }
  // 合并优先于碰撞分离（同等级接触即合，链式）
  if (merge()) return;
  // 圆-圆碰撞（多次迭代）
  for (let it = 0; it < 4; it++) {
    for (let i = 0; i < fruits.length; i++) {
      for (let j = i + 1; j < fruits.length; j++) {
        const a = fruits[i], b = fruits[j];
        const ra = radius(a.level), rb = radius(b.level);
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const minD = ra + rb;
        if (d < minD) {
          const nx = dx / d, ny = dy / d;
          const overlap = (minD - d) / 2;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          // 相对速度沿法线分量
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const imp = -(1 + REST) * vn / 2;
            a.vx -= imp * nx; a.vy -= imp * ny;
            b.vx += imp * nx; b.vy += imp * ny;
          }
        }
      }
    }
  }
}

function merge() {
  let merged = false, guard = 0;
  let did = true;
  while (did && guard < 24) {
    did = false; guard++;
    outer:
    for (let i = 0; i < fruits.length; i++) {
      for (let j = i + 1; j < fruits.length; j++) {
        const a = fruits[i], b = fruits[j];
        if (a.level !== b.level || a.level >= 11) continue;
        const ra = radius(a.level), rb = radius(b.level);
        const dx = b.x - a.x, dy = b.y - a.y;
        // 重叠 1px 以上即合成（merge 优先于碰撞分离，接触帧直接合并）
        if (Math.hypot(dx, dy) < ra + rb - 1) {
          const nl = a.level + 1;
          const nx = (a.x + b.x) / 2, ny = (a.y + b.y) / 2;
          const nvx = (a.vx + b.vx) / 2, nvy = (a.vy + b.vy) / 2;
          fruits.splice(j, 1);
          fruits.splice(i, 1);
          fruits.push({ level: nl, x: nx, y: ny, vx: nvx, vy: nvy, age: Math.max(a.age || 0, b.age || 0) });
          if (nl > maxLevel) { maxLevel = nl; updateMax(); }
          score += SCORE[nl];
          spawnParticles(nx, ny, nl);
          merged = true; did = true;
          break outer;
        }
      }
    }
  }
  return merged;
}

function updateMax() {
  maxLvEl.textContent = maxLevel >= 1 ? NAMES[maxLevel] : '—';
}

// 警戒检测：有已落下水果压在警戒线上方超时 → 结束
function checkDanger(dt) {
  let any = false;
  for (const f of fruits) {
    if ((f.age || 0) > 30 && f.y < DEATH_Y) { any = true; break; }
  }
  danger = any ? danger + dt : 0;
  if (danger > 1.5) gameOver();
}

// ---- 渲染 ----
function drawGuide() {
  if (!current) return;
  const r = radius(current.level);
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(current.x, current.y + r);
  ctx.lineTo(current.x, H - 4);
  ctx.stroke();
  ctx.setLineDash([]);
  // 警戒线
  ctx.strokeStyle = 'rgba(255,90,90,.28)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 5]);
  ctx.beginPath(); ctx.moveTo(0, DEATH_Y); ctx.lineTo(W, DEATH_Y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);
  drawGuide();
  for (const f of fruits) drawFruit(ctx, f.x, f.y, radius(f.level), f.level);
  if (current) drawFruit(ctx, current.x, current.y, radius(current.level), current.level);
  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  scoreEl.textContent = score;
  drawNext();
}

function drawNext() {
  nctx.clearRect(0, 0, 44, 44);
  drawFruit(nctx, 22, 22, Math.min(18, radius(nextLevel) * 0.7), nextLevel);
}

// ---- 主循环 ----
let raf = null;
function loop(t) {
  if (!running && !particles.length) { return; }
  const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0;
  lastT = t;
  // 固定步长物理
  step();
  if (running && !over) checkDanger(dt);
  // 粒子更新
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }
  render();
  raf = requestAnimationFrame(loop);
}

// ---- 流程 ----
function spawnCurrent() {
  const lvl = nextLevel;
  nextLevel = randLevel();
  current = { level: lvl, x: W / 2, y: radius(lvl) };
  drawNext();
}

async function gameOver() {
  if (over) return;
  over = true; running = false;
  document.getElementById('btnEnd').style.display = 'none';
  document.getElementById('btnStart').style.display = 'inline-block';
  render();
  await settleReward();
}

async function settleReward() {
  const reached = maxLevel >= 9;
  const token = GCAuth.getToken();
  if (!reached) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="big">游戏结束</div><div>本局最高合成 <b>' + (maxLevel >= 1 ? NAMES[maxLevel] + '（' + maxLevel + '级）' : '无') + '</b> · 得分 ' + score + '</div><div>合成出 <b>菠萝(9级)</b> 及以上才有额度奖励，再试一局吧～</div>';
    setStatus('点击「开始游戏」再来一局');
    return;
  }
  setStatus('结算中…');
  if (!token) {
    resultEl.style.display = 'block';
    resultEl.innerHTML = '<div class="big">🎉 合成了 ' + NAMES[maxLevel] + '！</div><div>本局得分 ' + score + '。你还没登录，登录后合成到 9 级及以上可领额度奖励。</div>';
    setStatus('登录后可领取额度奖励');
    return;
  }
  const r = await fetch('/api/solo/watermelon/reward', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, maxLevel, score }),
  }).catch(() => null);
  resultEl.style.display = 'block';
  if (!r || r.status !== 200) {
    const j = r ? await r.json().catch(() => ({})) : {};
    resultEl.innerHTML = '<div class="big">🎉 合成了 ' + NAMES[maxLevel] + '！</div><div>本局得分 ' + score + '，但奖励发放失败：' + (j.error || '网络错误') + '</div>';
    setStatus('奖励发放失败');
    return;
  }
  const d = await r.json();
  let html = '<div class="big" style="color:var(--green)">🎉 合成了 ' + NAMES[d.level] + '（' + d.level + '级）</div>';
  html += '<div>本局得分 <b>' + score + '</b> 分</div>';
  if (d.rewardUsd > 0) {
    html += '<div>本次奖励 <b style="color:var(--green)">+$' + d.rewardUsd.toFixed(2) + '</b> 已到账' + (d.capped ? '（已触及每日上限，按剩余额度发放）' : '') + '</div>';
  } else if (d.capped) {
    html += '<div>今日奖励额度已达上限（$' + d.dailyTotalUsd.toFixed(2) + '），本局不再发放。</div>';
  } else {
    html += '<div>本局未达奖励等级，再接再厉～</div>';
  }
  html += '<div>今日已领 <b>$' + d.dailyTotalUsd.toFixed(2) + '</b>，剩余可领 <b>$' + d.remainingUsd.toFixed(2) + '</b></div>';
  if (d.quota != null) html += '<div>当前余额 <b>$' + (d.quota / quotaPerUnit).toFixed(4) + '</b></div>';
  resultEl.innerHTML = html;
  setStatus('点击「开始游戏」再来一局');
}

function start() {
  if (running) return;
  const token = GCAuth.getToken();
  fruits = []; particles = [];
  score = 0; maxLevel = 0; danger = 0;
  over = false; running = true;
  scoreEl.textContent = '0';
  maxLvEl.textContent = '—';
  resultEl.style.display = 'none';
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnEnd').style.display = 'inline-block';
  nextLevel = randLevel();
  spawnCurrent();
  setStatus(token ? '游戏中：左右移动，点击放下' : '游戏中（未登录，结算时无法领取额度）');
  if (!raf) { lastT = 0; raf = requestAnimationFrame(loop); }
}

function endManually() {
  if (!running || over) return;
  gameOver();
}

// ---- 输入 ----
function boardPos(e) {
  const rect = board.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}

board.addEventListener('mousemove', (e) => {
  if (!running || over || !current) return;
  const p = boardPos(e);
  const r = radius(current.level);
  current.x = Math.max(r, Math.min(W - r, p.x));
});
board.addEventListener('click', (e) => {
  if (!running || over || !current) return;
  fruits.push({ level: current.level, x: current.x, y: current.y, vx: 0, vy: 0, age: 0 });
  current = null;
  spawnCurrent();
});
board.addEventListener('touchstart', (e) => {
  if (!running || over || !current) return;
  e.preventDefault();
  const p = boardPos(e.touches[0]);
  const r = radius(current.level);
  current.x = Math.max(r, Math.min(W - r, p.x));
}, { passive: false });
board.addEventListener('touchmove', (e) => {
  if (!running || over || !current) return;
  e.preventDefault();
  const p = boardPos(e.touches[0]);
  const r = radius(current.level);
  current.x = Math.max(r, Math.min(W - r, p.x));
}, { passive: false });
board.addEventListener('touchend', (e) => {
  if (!running || over || !current) return;
  e.preventDefault();
  fruits.push({ level: current.level, x: current.x, y: current.y, vx: 0, vy: 0, age: 0 });
  current = null;
  spawnCurrent();
}, { passive: false });

document.getElementById('btnStart').onclick = start;
document.getElementById('btnEnd').onclick = endManually;

setStatus('登录后点「开始游戏」（未登录也可免费试玩，但无法领取额度）');

// 调试/验证接口
window.__wm = {
  get fruits() { return fruits.length; },
  get firstY() { return fruits.length ? Math.round(fruits[0].y) : -1; },
  get score() { return score; },
  get maxLevel() { return maxLevel; },
  get running() { return running; },
  get current() { return current ? current.level : null; },
  get over() { return over; },
  get danger() { return +danger.toFixed(2); },
  debugDrop(level, x) { if (running && !over) fruits.push({ level, x: x != null ? x : W / 2, y: radius(level), vx: 0, vy: 0, age: 0 }); },
};
</script>
