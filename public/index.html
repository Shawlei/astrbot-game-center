<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covi的游戏屋</title>
<style>
:root {
  --bg: #07080f;
  --panel: rgba(255, 255, 255, .035);
  --border: rgba(255, 255, 255, .08);
  --text: #f2f4ff;
  --muted: #8b90a6;
  --accent: #6c7cff;
  --accent-2: #b16cff;
  --red: #ff5d5d;
  --green: #3ecf8e;
  --gold: #f6c343;
  --radius: 20px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

::selection { background: rgba(108,124,255,.35); }

/* ---- 背景层 ---- */
.bg { position: fixed; inset: 0; z-index: -3; background: var(--bg); }
.bg::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(60% 45% at 12% -5%, rgba(108,124,255,.16), transparent 60%),
    radial-gradient(50% 40% at 88% 0%, rgba(177,108,255,.14), transparent 60%),
    radial-gradient(55% 50% at 50% 110%, rgba(255,106,154,.10), transparent 60%);
}
.bg::after {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 52px 52px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% -5%, #000 15%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% -5%, #000 15%, transparent 75%);
}
#stars { position: fixed; inset: 0; z-index: -2; }
#cursorGlow {
  position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none;
  width: 520px; height: 520px; border-radius: 50%;
  background: radial-gradient(circle, rgba(108,124,255,.10), transparent 65%);
  transform: translate(-50%, -50%); opacity: 0; transition: opacity .4s;
}

/* ---- 顶栏 ---- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; transition: all .3s ease;
}
.nav.scrolled {
  background: rgba(10,11,20,.72); backdrop-filter: blur(18px) saturate(160%);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand .logo {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 21px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 22px rgba(108,124,255,.4);
}
.brand .brand-txt { font-size: 17px; font-weight: 800; letter-spacing: .4px; }
.nav .nav-right { display: flex; align-items: center; gap: 10px; }
.nav .nav-chip {
  font-size: 12px; color: #cfe8ff; background: rgba(108,124,255,.12);
  border: 1px solid rgba(108,124,255,.3); padding: 5px 13px; border-radius: 999px; font-weight: 600;
  backdrop-filter: blur(8px);
}

/* ---- 容器 ---- */
.shell { max-width: 1080px; margin: 0 auto; padding: 0 24px 60px; }

/* ---- Hero ---- */
.hero { text-align: center; padding: 150px 0 30px; }
.hero .kicker {
  display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
  color: #c9d1ff; background: rgba(108,124,255,.1); border: 1px solid rgba(108,124,255,.25);
  padding: 7px 16px; border-radius: 999px; margin-bottom: 22px;
}
.hero .kicker .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(62,207,142,.6); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(62,207,142,.55); } 70% { box-shadow: 0 0 0 9px rgba(62,207,142,0); } 100% { box-shadow: 0 0 0 0 rgba(62,207,142,0); } }
.hero h1 {
  font-size: clamp(38px, 7.5vw, 72px); font-weight: 900; letter-spacing: -.5px; line-height: 1.08;
  background: linear-gradient(100deg, #fff 5%, #b9c4ff 30%, #e3b6ff 55%, #ffc9de 80%, #fff 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shine 8s linear infinite;
}
@keyframes shine { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
.hero .sub { color: var(--muted); font-size: 17px; margin-top: 16px; max-width: 560px; margin-left: auto; margin-right: auto; }
.hero .stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
.hero .stat {
  min-width: 130px; padding: 16px 20px; border-radius: 16px;
  background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(10px);
}
.hero .stat .num { font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
.hero .stat .num span { background: linear-gradient(120deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.hero .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 3px; }
.hero .scroll-hint { margin-top: 40px; color: var(--muted); font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero .scroll-hint .mouse { width: 22px; height: 34px; border: 1.5px solid var(--muted); border-radius: 12px; display: flex; justify-content: center; padding-top: 6px; }
.hero .scroll-hint .wheel { width: 3px; height: 7px; border-radius: 3px; background: var(--muted); animation: wheel 1.8s infinite; }
@keyframes wheel { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(10px); } }

/* ---- 登录条 ---- */
.auth-bar {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 18px; margin: 10px 0 6px; backdrop-filter: blur(14px);
}
.auth-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.auth-form input {
  flex: 1; min-width: 120px; background: rgba(255,255,255,.05); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 11px 15px; font-size: 13.5px; outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.auth-form input::placeholder { color: #6b7086; }
.auth-form input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,124,255,.16); }
.auth-user { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--text); flex-wrap: wrap; }
.auth-user b { font-size: 15px; }
.auth-user .auth-quota {
  font-size: 12.5px; color: var(--gold); background: rgba(246,195,67,.1);
  border: 1px solid rgba(246,195,67,.28); padding: 4px 13px; border-radius: 999px; font-weight: 700;
}
.auth-user .auth-btn {
  margin-left: auto; background: rgba(255,255,255,.05); color: var(--muted);
  border: 1px solid var(--border); border-radius: 10px; padding: 7px 15px; font-size: 12px; cursor: pointer; transition: all .18s;
}
.auth-user .auth-btn:hover { color: var(--text); border-color: var(--red); }

/* ---- 按钮 ---- */
button {
  background: rgba(255,255,255,.05); color: var(--text); border: 1px solid var(--border);
  border-radius: 12px; padding: 11px 20px; font-size: 14px; cursor: pointer; transition: all .18s ease;
  font-family: inherit;
}
button:hover { border-color: var(--accent); }
button.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: none;
  font-weight: 700; color: #fff; box-shadow: 0 8px 24px rgba(108,124,255,.32);
}
button.primary:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(108,124,255,.44); }
button:active { transform: translateY(0) scale(.98); }
button:disabled { opacity: .45; cursor: not-allowed; }

/* ---- 分区 ---- */
.section { margin-top: 46px; }
.section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.section-head .ico {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 19px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow: 0 6px 18px rgba(108,124,255,.28);
}
.section-head .ttl { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
.section-head .cnt { font-size: 12px; color: var(--muted); margin-left: 2px; }
.section-head::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--border), transparent); margin-left: 6px; }

/* ---- 游戏卡片 ---- */
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.game-card {
  position: relative; display: block; overflow: hidden;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; text-decoration: none; color: var(--text);
  perspective: 800px;
  transition: border-color .25s ease, box-shadow .25s ease, opacity .6s ease, transform .6s ease;
  opacity: 0; transform: translateY(20px);
}
.game-card.revealed { opacity: 1; transform: translateY(0); }
.game-card::before {
  content: ''; position: absolute; inset: 0; z-index: 0; opacity: 0; transition: opacity .3s;
  background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%), var(--tint2, rgba(255,255,255,.08)), transparent 60%);
}
.game-card::after {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--hc, var(--accent)), transparent);
  opacity: 0; transition: opacity .3s;
}
.game-card:hover { border-color: var(--hc, var(--accent)); box-shadow: 0 22px 48px -18px var(--hs, rgba(0,0,0,.7)); }
.game-card:hover::before, .game-card:hover::after { opacity: 1; }
.gc-inner {
  position: relative; z-index: 1; display: flex; align-items: center; gap: 14px;
  padding: 18px 16px; transform-style: preserve-3d; will-change: transform;
}
.game-card .gc-icon {
  width: 54px; height: 54px; border-radius: 15px; flex-shrink: 0; display: grid; place-items: center; font-size: 27px;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  box-shadow: 0 8px 20px -6px var(--hs, rgba(0,0,0,.5));
  transform: translateZ(26px);
}
.game-card .gc-body { min-width: 0; flex: 1; transform: translateZ(18px); }
.game-card .gc-name { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 7px; }
.game-card .gc-tag {
  font-size: 10px; font-weight: 700; color: var(--c1); background: var(--tint, rgba(255,255,255,.06));
  border: 1px solid var(--hc, transparent); padding: 2px 7px; border-radius: 6px; letter-spacing: .3px;
}
.game-card .gc-desc { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.game-card .gc-go {
  flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); font-size: 16px; background: rgba(255,255,255,.05); border: 1px solid var(--border);
  transition: all .22s; transform: translateZ(30px);
}
.game-card:hover .gc-go { color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); border-color: transparent; }
.game-card.wide { grid-column: 1 / -1; }

/* ---- 房间码 ---- */
.room-card {
  position: relative; margin-top: 18px; border-radius: var(--radius); padding: 1px;
  background: linear-gradient(120deg, var(--accent), var(--accent-2), #ff6a9a);
  box-shadow: 0 16px 40px -18px rgba(108,124,255,.55);
}
.room-card .inner {
  background: #0f111d; border-radius: calc(var(--radius) - 1px); padding: 20px 22px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.room-card .rc-icon { font-size: 28px; }
.room-card .rc-title { font-size: 16px; font-weight: 800; }
.room-card .rc-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; overflow-wrap: anywhere; }
.room-card .rc-sub b { color: var(--text); font-weight: 600; }
.room-card .rc-form { display: flex; gap: 8px; flex: 1; min-width: 260px; }
.room-card input {
  flex: 1; min-width: 140px; background: rgba(255,255,255,.04); color: var(--text);
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; font-size: 14px; outline: none;
  letter-spacing: 1px; text-transform: uppercase; transition: border-color .18s, box-shadow .18s;
}
.room-card input::placeholder { color: #6b7086; letter-spacing: 0; }
.room-card input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,124,255,.16); }

/* ---- 排行榜 ---- */
.leaderboard {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px 22px; margin-top: 6px; backdrop-filter: blur(14px);
}
.lb-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
.lb-tab {
  background: rgba(255,255,255,.04); color: var(--muted); border: 1px solid var(--border);
  border-radius: 999px; padding: 6px 15px; font-size: 13px; cursor: pointer; transition: all .18s ease; font-family: inherit;
}
.lb-tab:hover { color: var(--text); border-color: var(--accent); }
.lb-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  border-color: transparent; font-weight: 700; box-shadow: 0 4px 14px rgba(108,124,255,.3);
}
.lb-row { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--border); font-size: 13px; }
.lb-row:last-child { border-bottom: none; }
.lb-rank {
  width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; background: rgba(255,255,255,.05); color: var(--muted); flex-shrink: 0;
}
.lb-rank.top { background: linear-gradient(135deg, #ffd76a, #f5a623); color: #241a00; box-shadow: 0 4px 12px -3px rgba(245,166,35,.5); }
.lb-rank.top.silver { background: linear-gradient(135deg, #e6ecf7, #9fb0c8); color: #222b3d; box-shadow: 0 4px 12px -3px rgba(159,176,200,.5); }
.lb-rank.top.bronze { background: linear-gradient(135deg, #e8b48a, #c07a45); color: #33200c; box-shadow: 0 4px 12px -3px rgba(192,122,69,.5); }
.lb-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-weight: 600; }
.lb-sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
.lb-val { color: var(--gold); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.lb-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }

/* ---- 页脚 ---- */
.footer { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 52px; line-height: 1.7; }
.footer b { color: var(--text); font-weight: 600; }

/* 渐入 */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: translateY(0); }

@media (max-width: 600px) {
  .nav { padding: 12px 16px; }
  .nav .nav-chip { display: none; }
  .shell { padding: 0 16px 44px; }
  .hero { padding-top: 130px; }
  .games { grid-template-columns: 1fr; }
  .room-card .rc-form { flex-direction: column; }
  .room-card input { width: 100%; }
  .lb-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .hero h1 { animation: none; }
}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="stars"></canvas>
<div id="cursorGlow"></div>

<nav class="nav" id="nav">
  <div class="brand">
    <div class="logo">🎮</div>
    <div class="brand-txt">Covi的游戏屋</div>
  </div>
  <div class="nav-right">
    <span class="nav-chip">✦ Covi's Game House</span>
  </div>
</nav>

<div class="shell">
  <header class="hero">
    <div class="kicker"><span class="pulse"></span> 已上线 · 与机器人账号互通</div>
    <h1>Covi的游戏屋</h1>
    <p class="sub">一个小而精致的游戏屋 —— 单机小游戏、联机对战、模拟股市，赢了返额度，输了扣额度。</p>
    <div class="stats">
      <div class="stat"><div class="num"><span class="count" data-to="9">0</span></div><div class="lbl">款游戏</div></div>
      <div class="stat"><div class="num"><span class="count" data-to="3">0</span></div><div class="lbl">联机对战</div></div>
      <div class="stat"><div class="num"><span class="count" data-to="5">0</span></div><div class="lbl">单机小游戏</div></div>
      <div class="stat"><div class="num"><span class="count" data-to="1">0</span></div><div class="lbl">模拟股市</div></div>
    </div>
    <div class="scroll-hint"><div class="mouse"><div class="wheel"></div></div><span>向下探索</span></div>
  </header>

  <div class="reveal"><div id="authBar"></div></div>

  <section class="section reveal">
    <div class="section-head"><div class="ico">⚔️</div><div class="ttl">联机对战</div><div class="cnt" id="pvpCnt"></div></div>
    <div class="games" id="pvpGames"></div>
    <div class="room-card">
      <div class="inner">
        <div class="rc-icon">🚪</div>
        <div style="flex:1 1 220px;min-width:0">
          <div class="rc-title">凭房间码进入对战</div>
          <div class="rc-sub">机器人在群里匹配成功后私聊发码：<b>%斗地主</b> / <b>%象棋对战</b> / <b>%五子棋对战</b></div>
        </div>
        <div class="rc-form">
          <input id="roomCode" type="text" placeholder="输入房间码（如 ABC123）" maxlength="6" autocomplete="off">
          <button id="btnJoin" class="primary">进入对战</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section reveal">
    <div class="section-head"><div class="ico">🎰</div><div class="ttl">单机小游戏</div><div class="cnt" id="soloCnt"></div></div>
    <div class="games" id="soloGames"></div>
  </section>

  <section class="section reveal">
    <div class="section-head"><div class="ico">📈</div><div class="ttl">模拟股市</div><div class="cnt" id="marketCnt"></div></div>
    <div class="games" id="marketGames"></div>
  </section>

  <section class="section reveal">
    <div class="section-head"><div class="ico">🏆</div><div class="ttl">排行榜</div></div>
    <div class="leaderboard">
      <div class="lb-tabs" id="lbTabs"></div>
      <div id="lbList"></div>
    </div>
  </section>

  <div class="footer" id="hint">Covi的游戏屋 · 联机对战请在群里发 <b>%斗地主</b> / <b>%象棋对战</b> / <b>%五子棋对战</b> 匹配，凭机器人私聊的房间码进入。</div>
</div>

<script src="/js/auth.js"></script>
<script>
const gid = new URLSearchParams(location.search).get('gid');
const q = gid ? ('?gid=' + encodeURIComponent(gid)) : '';

// 每款游戏的视觉元信息
const GAME_META = {
  doudizhu:   { icon: '🃏', c1: '#ff6a4d', c2: '#ff2d78', tint: 'rgba(255,90,80,.15)',  tint2: 'rgba(255,90,80,.16)',  hc: 'rgba(255,90,80,.65)',  tag: '3人', desc: '三人一桌，叫地主 / 加倍 / 炸弹，经典斗地主规则。' },
  xiangqi:    { icon: '♟️', c1: '#f5a623', c2: '#e07b39', tint: 'rgba(245,166,35,.15)', tint2: 'rgba(245,166,35,.16)', hc: 'rgba(245,166,35,.65)', tag: '2人', desc: '红黑对弈，将死对方获胜。两人实时对战，押注真实额度。' },
  gomoku:     { icon: '⚫', c1: '#4dd0e1', c2: '#26a69a', tint: 'rgba(77,208,225,.15)', tint2: 'rgba(77,208,225,.16)', hc: 'rgba(77,208,225,.65)', tag: '2人', desc: '黑白对弈，连五即胜。规则简单，节奏快。' },
  snake:      { icon: '🐍', c1: '#66bb6a', c2: '#2e7d32', tint: 'rgba(102,187,106,.15)', tint2: 'rgba(102,187,106,.16)', hc: 'rgba(102,187,106,.65)', tag: '单机', desc: '门票入场，吃食越多奖励越高，方向键 / 滑动操控。' },
  breakout:   { icon: '🎮', c1: '#42a5f5', c2: '#1e88e5', tint: 'rgba(66,165,245,.15)', tint2: 'rgba(66,165,245,.16)', hc: 'rgba(66,165,245,.65)', tag: '单机', desc: '移动横板反弹球，打落方块接道具，破坏越多奖励越高。' },
  twentyfour: { icon: '🧮', c1: '#ab47bc', c2: '#7b1fa2', tint: 'rgba(171,71,188,.15)', tint2: 'rgba(171,71,188,.16)', hc: 'rgba(171,71,188,.65)', tag: '单机', desc: '四张牌算出 24，答对赢额、答错扣额。' },

const STATIC = {
  pvp:    [ ['doudizhu','斗地主'], ['xiangqi','中国象棋'], ['gomoku','五子棋'] ],
  solo:   [ ['snake','贪吃蛇'], ['breakout','打砖块'], ['twentyfour','24点'], ['dice','猜大小'], ['lottery','双色球'] ],

};

function cardHTML(type, name, url) {
  const m = GAME_META[type] || { icon: '🎮', c1: '#6c7cff', c2: '#b16cff', tint: 'rgba(108,124,255,.15)', tint2: 'rgba(108,124,255,.16)', hc: 'rgba(108,124,255,.65)', tag: '', desc: '' };
  const style = '--c1:' + m.c1 + ';--c2:' + m.c2 + ';--tint:' + m.tint + ';--tint2:' + m.tint2 + ';--hc:' + m.hc + ';--hs:' + m.c1 + '66;';
  return '<a class="game-card" href="/' + url + q + '" style="' + style + '">' +
    '<div class="gc-inner">' +
      '<div class="gc-icon">' + m.icon + '</div>' +
      '<div class="gc-body"><div class="gc-name">' + name +
        (m.tag ? '<span class="gc-tag">' + m.tag + '</span>' : '') +
      '</div><div class="gc-desc">' + m.desc + '</div></div>' +
      '<div class="gc-go">›</div>' +
    '</div></a>';
}

const hoverable = () => window.matchMedia('(hover: hover)').matches;

function bindCard(card, i) {
  card.classList.add('revealed');
  card.style.transition = 'opacity .6s ease ' + (i * 45) + 'ms, transform .6s ease ' + (i * 45) + 'ms, border-color .25s ease, box-shadow .25s ease';
  if (!hoverable()) return;
  const inner = card.querySelector('.gc-inner');
  card.addEventListener('mousemove', (e) => {
    const r = card.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    card.style.setProperty('--mx', x + 'px');
    card.style.setProperty('--my', y + 'px');
    if (!inner) return;
    const px = (x / r.width - 0.5), py = (y / r.height - 0.5);
    inner.style.transition = 'none';
    inner.style.transform = 'rotateX(' + (-py * 9).toFixed(2) + 'deg) rotateY(' + (px * 12).toFixed(2) + 'deg)';
  });
  card.addEventListener('mouseleave', () => {
    if (!inner) return;
    inner.style.transition = 'transform .5s cubic-bezier(.2,.7,.2,1)';
    inner.style.transform = '';
  });
}

function renderGames(el, items, wide) {
  el.innerHTML = '';
  items.forEach((g, i) => {
    const wrap = document.createElement('div');
    wrap.innerHTML = cardHTML(g.type, g.name, g.url);
    const node = wrap.firstElementChild;
    if (!node) return;
    if (wide && i === 0) node.classList.add('wide');
    el.appendChild(node);
    bindCard(node, i);
  });
}

function setCnt(id, n) { const e = document.getElementById(id); if (e) e.textContent = n ? n + ' 款' : ''; }

function animateCount() {
  document.querySelectorAll('.count').forEach((el) => {
    const to = +el.dataset.to || 0;
    const t0 = performance.now(), dur = 1200;
    function tick(t) {
      const p = Math.min((t - t0) / dur, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function loadGames() {
  const soloEl = document.getElementById('soloGames');
  const marketEl = document.getElementById('marketGames');
  const pvpEl = document.getElementById('pvpGames');
  let pvp = [], solo = [], market = [];
  try {
    const j = await (await fetch('/api/games')).json();
    const list = (j.list || []).filter((g) => g.enabled !== false);
    pvp = list.filter((g) => g.category === 'pvp');
    solo = list.filter((g) => g.category === 'solo');
    market = list.filter((g) => g.category === 'market');
  } catch (e) {
    pvp = STATIC.pvp.map(([t, n]) => ({ type: t, name: n, url: t + '.html' }));
    solo = STATIC.solo.map(([t, n]) => ({ type: t, name: n, url: t + '.html' }));
    market = STATIC.market.map(([t, n]) => ({ type: t, name: n, url: t + '.html' }));
  }
  renderGames(pvpEl, pvp, false);
  renderGames(soloEl, solo, false);
  renderGames(marketEl, market, market.length <= 1);
  setCnt('pvpCnt', pvp.length);
  setCnt('soloCnt', solo.length);
  setCnt('marketCnt', market.length);
  const total = pvp.length + solo.length + market.length;
  document.querySelector('[data-to="9"]').dataset.to = total;
  document.querySelector('[data-to="3"]').dataset.to = pvp.length;
  document.querySelector('[data-to="5"]').dataset.to = solo.length;
  document.querySelector('[data-to="1"]').dataset.to = market.length;
}

// ---- 房间码进房 ----
document.getElementById('btnJoin').onclick = async () => {
  const token = GCAuth.getToken();
  if (!token) { alert('请先登录 NewAPI 账号'); return; }
  const code = document.getElementById('roomCode').value.trim().toUpperCase();
  if (!code) { alert('请输入房间码'); return; }
  try {
    const r = await fetch('/api/room/join-by-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, token }),
    });
    const j = await r.json();
    if (j.code !== 'ok') { alert(j.error || '进入失败'); return; }
    GCAuth.saveBattle(j.gameType, j.roomId, j.player, j.wsToken);
    location.href = '/' + j.gameType + '.html';
  } catch (e) { alert('网络错误，请稍后重试'); }
};

const LB = [
  { key: 'snake', label: '贪吃蛇', type: 'solo' },
  { key: 'breakout', label: '打砖块', type: 'solo' },
  { key: 'twentyfour', label: '24点', type: 'solo' },
  { key: 'dice', label: '猜大小', type: 'solo' },
  { key: 'lottery', label: '双色球', type: 'solo' },
  { key: 'doudizhu', label: '斗地主', type: 'pvp' },
  { key: 'xiangqi', label: '象棋', type: 'pvp' },
  { key: 'gomoku', label: '五子棋', type: 'pvp' },
  { key: 'market', label: '股市', type: 'market' },
];
const tabsEl = document.getElementById('lbTabs');
const listEl = document.getElementById('lbList');
LB.forEach((t, i) => {
  const b = document.createElement('button');
  b.className = 'lb-tab' + (i === 0 ? ' active' : '');
  b.textContent = t.label;
  b.onclick = () => loadLB(i);
  tabsEl.appendChild(b);

function lbRow(rank, name, val, sub) {
  const div = document.createElement('div');
  div.className = 'lb-row';
  const medal = rank === 0 ? 'top' : rank === 1 ? 'top silver' : rank === 2 ? 'top bronze' : '';
  div.innerHTML =
    '<div class="lb-rank ' + medal + '">' + (rank < 3 ? ['🥇','🥈','🥉'][rank] : rank + 1) + '</div>' +
    '<div class="lb-name">' + escapeHtml(name) + '</div>' +
    (sub ? '<div class="lb-sub">' + sub + '</div>' : '') +
    (val ? '<div class="lb-val">' + val + '</div>' : '');
  return div;
}

async function loadLB(idx) {
  document.querySelectorAll('.lb-tab').forEach((b, i) => b.classList.toggle('active', i === idx));
  const t = LB[idx];
  listEl.innerHTML = '<div class="lb-empty">加载中…</div>';
  try {
    let rows = [];
    if (t.type === 'market') {
      const j = await (await fetch('/api/market/leaderboard?limit=20')).json();
      rows = (j.list || []).map((r) => ({ name: r.name, val: '$' + r.marketValue.toFixed(2), sub: r.stocks + ' 只 · 盈亏 ' + fmtUsd(r.pnl) }));
    } else {
      const j = await (await fetch('/api/leaderboard?gameType=' + t.key + '&limit=20')).json();
      rows = (j.list || []).map((r) => t.type === 'solo'
        ? { name: r.name, val: fmtUsd(r.netUsd), sub: r.games + '局 · 最高' + fmtUsd(r.bestUsd) }
        : { name: r.name, val: r.win + ' 胜', sub: r.win + '胜 ' + r.lose + '负' + (r.draw ? ' ' + r.draw + '平' : '') });
    }
    if (!rows.length) { listEl.innerHTML = '<div class="lb-empty">暂无记录，快去玩一局吧</div>'; return; }
    listEl.innerHTML = '';
    rows.forEach((r, i) => listEl.appendChild(lbRow(i, r.name, r.val, r.sub)));
  } catch (e) {
    listEl.innerHTML = '<div class="lb-empty">排行榜加载失败</div>';
  }
}

function fmtUsd(n) { const v = Number(n || 0); return (v >= 0 ? '+' : '') + '$' + v.toFixed(2); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---- 渐入观察 ----
const io = new IntersectionObserver((entries) => {
  entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach((el) => io.observe(el));

const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 20), { passive: true });

// ---- 光标光晕 ----
if (hoverable()) {
  const glow = document.getElementById('cursorGlow');
  let gx = -999, gy = -999, tx = -999, ty = -999;
  window.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; glow.style.opacity = 1; });
  window.addEventListener('mouseleave', () => { glow.style.opacity = 0; });
  (function loop() {
    gx += (tx - gx) * 0.08; gy += (ty - gy) * 0.08;
    glow.style.transform = 'translate(' + (gx - 260) + 'px,' + (gy - 260) + 'px)';
    requestAnimationFrame(loop);
  })();
}

// ---- 粒子背景 ----
(function stars() {
  const cv = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  const colors = ['108,124,255', '177,108,255', '246,195,67'];
  let W, H, pts = [], mx = -999, my = -999;
  function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; seed(); }
  function seed() {
    const n = Math.min(90, Math.floor(W * H / 16000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + .4,
      vx: (Math.random() - .5) * .18, vy: (Math.random() - .5) * .18,
      c: colors[(Math.random() * colors.length) | 0], a: Math.random() * .5 + .15,
    }));
  }
  if (hoverable()) window.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < -20) p.x = W + 20; else if (p.x > W + 20) p.x = -20;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
      const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
      if (d2 < 16000) { const f = (1 - d2 / 16000) * .4; p.x += dx * f * .04; p.y += dy * f * .04; }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + p.c + ',' + p.a + ')';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize);
  resize(); tick();
})();
